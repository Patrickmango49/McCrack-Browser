<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>𝕄𝕔ℂ𝕣𝕒𝕔𝕜 Browser</title>
<link rel="icon" href="./favicon.ico">
<style>
:root{color-scheme:dark;--bg:#08090c;--panel:#15171c;--line:#2b2e36;--text:#f5f7fb;--muted:#a2a8b4;--accent:#9bc4ff}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
.tabs{display:flex;align-items:center;gap:8px;padding:9px 10px 0;background:#111216;border-bottom:1px solid var(--line);overflow-x:auto}.tab{display:flex;align-items:center;gap:16px;min-width:150px;max-width:230px;padding:11px 13px;border:1px solid var(--line);border-bottom:0;border-radius:11px 11px 0 0;background:#1b1d23;color:var(--muted);cursor:pointer}.tab.active{background:#292c34;color:var(--text)}.tab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.close{border:0;background:none;color:inherit;cursor:pointer}.add,.tool{border:1px solid var(--line);background:#1b1d23;color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer}.add{margin-bottom:7px;font-size:18px}.toolbar{display:flex;gap:9px;align-items:center;padding:12px;background:#111216;border-bottom:1px solid var(--line)}.address{display:flex;gap:9px;flex:1;min-width:0}.address input{min-width:0;flex:1;border:1px solid #333741;border-radius:12px;background:#090a0d;color:var(--text);padding:0 16px;height:43px;outline:none}.address input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9bc4ff22}.go{background:#eaf1ff;color:#10141b;border:0;border-radius:12px;padding:0 19px;font-weight:700;cursor:pointer}.view{position:relative;min-height:0}.frame{width:100%;height:100%;border:0;background:white;display:none}.frame.active{display:block}.home{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#222a3b 0,transparent 45%),linear-gradient(#0c0d11,#050506)}.home.hidden{display:none}.hero{width:min(600px,100%);text-align:center}.logo{font-size:clamp(38px,8vw,72px);font-weight:850;letter-spacing:.08em;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 28px}.home form{display:flex;gap:9px}.home input{flex:1;min-width:0;border:1px solid #333741;border-radius:999px;background:#111319;color:white;padding:15px 19px;outline:none}.home button{border:0;border-radius:999px;padding:0 23px;background:#eaf1ff;color:#10141b;font-weight:700;cursor:pointer}.status{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#777f8e;font-size:12px;pointer-events:none}@media(max-width:650px){.toolbar{gap:6px;padding:8px}.tool{padding:9px}.tab{min-width:120px}.go{padding:0 12px}.counter{display:none}}
</style>
</head>
<body>
<div class="tabs" id="tabs"><button class="add" id="newTab" title="New tab">+</button></div>
<div class="toolbar">
  <button class="tool" id="back" title="Back" aria-label="Back">←</button>
  <button class="tool" id="forward" title="Forward" aria-label="Forward">→</button>
  <button class="tool" id="reload" title="Reload" aria-label="Reload">↻</button>
  <form class="address" id="addressForm"><input id="address" placeholder="Search or enter a website address" autocomplete="off" spellcheck="false" aria-label="Search or enter a website address"><button class="go" type="submit">Go</button></form>
</div>
<main class="view" id="view"><section class="home" id="home"><div class="hero"><h1 class="logo">𝕄𝕔ℂ𝕣𝕒𝕔𝕜</h1><p class="sub">A simple, clean browsing experience.</p><form id="homeForm"><input id="homeAddress" placeholder="Search the web or enter a URL" autocomplete="off" aria-label="Search the web or enter a URL"><button>Search</button></form></div><div class="status" id="status">Ready when you are</div></section></main>
<script>
(() => {
  // This page delegates page loading to the configured hosted Scramjet endpoint.
  // It does not run a local Ultraviolet/Bare engine.
  const PROXY_ORIGIN = "https://d2quc4oxlcm8y8.cloudfront.net";
  const PROXY_PREFIX = "/scramjet/";
  const tabs = [];
  let active = 0;
  const $ = id => document.getElementById(id);
  const view = $("view"), tabBar = $("tabs"), home = $("home");

  function normalize(raw) {
    const value = raw.trim();
    if (!value) return null;
    if (/^(about:blank|https?:\/\/)/i.test(value)) {
      if (value.toLowerCase() === "about:blank") return "about:blank";
      try { return new URL(value).href; } catch { return null; }
    }
    if (/^(localhost|127\.0\.0\.1)(:\d+)?([/?:#]|$)/i.test(value) || /^[\w-]+(\.[\w-]+)+(\/[^\s]*)?([?#][^\s]*)?$/i.test(value)) {
      try { return new URL("https://" + value).href; } catch { return null; }
    }
    return "https://www.google.com/search?q=" + encodeURIComponent(value);
  }

  function proxyUrl(target) {
    // The endpoint expects the full destination URL percent-encoded in its path.
    const withCacheBuster = new URL(target);
    withCacheBuster.searchParams.set("zx", Date.now().toString());
    return PROXY_ORIGIN + PROXY_PREFIX + encodeURIComponent(withCacheBuster.href);
  }

  function makeTab() {
    const tab = { url: "", title: "New Tab", frame: document.createElement("iframe"), history: [], historyIndex: -1 };
    tab.frame.className = "frame";
    tab.frame.setAttribute("referrerpolicy", "no-referrer");
    tab.frame.setAttribute("allow", "fullscreen; autoplay; clipboard-read; clipboard-write");
    tab.frame.addEventListener("load", () => {
      if (tabs[active] === tab) $("status").textContent = "Loaded through the hosted browsing endpoint";
    });
    view.appendChild(tab.frame);
    tabs.splice(active + 1, 0, tab);
    active++;
    render();
  }

  function open(raw, record = true) {
    const tab = tabs[active];
    const target = normalize(raw);
    if (!tab || !target) { $("status").textContent = "Enter a valid website address or search phrase."; return; }
    tab.url = target;
    tab.title = target === "about:blank" ? "New Tab" : (() => { try { return new URL(target).hostname.replace(/^www\./, ""); } catch { return "Web page"; } })();
    if (record) {
      tab.history = tab.history.slice(0, tab.historyIndex + 1);
      tab.history.push(target);
      tab.historyIndex = tab.history.length - 1;
    }
    tab.frame.src = target === "about:blank" ? "about:blank" : proxyUrl(target);
    home.classList.add("hidden");
    $("address").value = target === "about:blank" ? "" : target;
    $("status").textContent = "Connecting…";
    render();
  }

  function render() {
    [...tabBar.querySelectorAll(".tab")].forEach(el => el.remove());
    tabs.forEach((tab, i) => {
      const button = document.createElement("button");
      button.className = "tab" + (i === active ? " active" : "");
      button.type = "button";
      const label = document.createElement("span");
      label.textContent = tab.title;
      const close = document.createElement("span");
      close.className = "close"; close.textContent = "×"; close.setAttribute("aria-label", "Close tab");
      close.addEventListener("click", event => { event.stopPropagation(); removeTab(i); });
      button.append(label, close);
      button.addEventListener("click", () => { active = i; sync(); });
      tabBar.insertBefore(button, $("newTab"));
    });
    sync();
  }

  function sync() {
    tabs.forEach((tab, i) => tab.frame.classList.toggle("active", i === active));
    const tab = tabs[active];
    const isHome = !tab || !tab.url;
    home.classList.toggle("hidden", !isHome);
    $("address").value = isHome ? "" : tab.url;
    $("back").disabled = !tab || tab.historyIndex <= 0;
    $("forward").disabled = !tab || tab.historyIndex >= tab.history.length - 1;
    $("reload").disabled = !tab || !tab.url;
  }

  function removeTab(i) {
    if (tabs.length === 1) {
      const tab = tabs[0]; tab.url = ""; tab.title = "New Tab"; tab.history = []; tab.historyIndex = -1; tab.frame.src = "about:blank"; active = 0; render(); return;
    }
    tabs[i].frame.remove(); tabs.splice(i, 1);
    if (active > i) active--; else if (active === i) active = Math.min(i, tabs.length - 1);
    render();
  }

  $("newTab").addEventListener("click", () => { active = tabs.length - 1; makeTab(); });
  $("addressForm").addEventListener("submit", e => { e.preventDefault(); open($("address").value); });
  $("homeForm").addEventListener("submit", e => { e.preventDefault(); open($("homeAddress").value); });
  $("back").addEventListener("click", () => { const t = tabs[active]; if (t && t.historyIndex > 0) { t.historyIndex--; open(t.history[t.historyIndex], false); } });
  $("forward").addEventListener("click", () => { const t = tabs[active]; if (t && t.historyIndex < t.history.length - 1) { t.historyIndex++; open(t.history[t.historyIndex], false); } });
  $("reload").addEventListener("click", () => { const t = tabs[active]; if (t && t.url) { t.frame.src = proxyUrl(t.url); $("status").textContent = "Reloading…"; } });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "t") { e.preventDefault(); active = tabs.length - 1; makeTab(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "w") { e.preventDefault(); removeTab(active); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "l") { e.preventDefault(); $("address").focus(); $("address").select(); }
  });
  makeTab();
})();
</script>
</body>
</html>
